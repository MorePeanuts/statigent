[project]
name = "statigent-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "ipykernel==6.30.1",
  "jupyter-client==8.6.3",
  "nbformat==5.10.4",
  "numpy==2.3.3",
  "pandas==2.3.2",
  "matplotlib==3.10.6",
  # DSBench-Analysis ships .xlsx/.xlsm workbooks (openpyxl) and .xlsb workbooks (pyxlsb).
  "openpyxl==3.1.5",
  "pyxlsb==1.0.10",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
  "joblib==1.5.2",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-m 'not integration and not upstream'"
markers = ["integration: starts a real local Jupyter kernel (explicit opt-in)", "upstream: requires local benchmark resources (explicit opt-in)"]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["python/**/*.py", "tests/python/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
