[project]
name = "statigent-baseline-autogluon"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "autogluon.tabular==1.4.0",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
  "lightgbm==4.6.0",
  "catboost==1.2.8",
  "xgboost==3.0.5",
  "torch==2.7.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
